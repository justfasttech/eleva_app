<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eleva — Redefinir Senha</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #FAF6EE;
      color: #3D3D3D;
      font-family: 'DM Sans', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      text-align: center;
    }
    .logo {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, #E8B84B, #F2D68A);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .logo svg { width: 30px; height: 30px; fill: white; }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: #8A8A8A; margin-bottom: 28px; }
    .field { margin-bottom: 16px; text-align: left; }
    .field label { display: block; font-size: 13px; font-weight: 600; color: #3D3D3D; margin-bottom: 6px; }
    .field input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #E8E4DC;
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .field input:focus { border-color: #E8B84B; }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #E8B84B;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }
    .btn:hover { background: #D4A43A; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    .error { color: #e53e3e; font-size: 13px; margin-top: 8px; text-align: left; }
    .success { color: #38a169; font-size: 14px; margin-top: 16px; }
    .back-link { display: inline-block; margin-top: 20px; color: #E8B84B; font-size: 14px; font-weight: 500; text-decoration: none; }
    @media (prefers-color-scheme: dark) {
      body { background: #1A1816; color: #E8E4DC; }
      .card { background: #242220; box-shadow: 0 4px 24px rgba(0,0,0,0.3); }
      h1 { color: #E8E4DC; }
      .field label { color: #E8E4DC; }
      .field input { background: #1A1816; border-color: #3A3632; color: #E8E4DC; }
      .field input:focus { border-color: #E8B84B; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
    </div>

    <div id="form-view">
      <h1>Redefinir Senha</h1>
      <p class="subtitle">Digite sua nova senha abaixo.</p>
      <div class="field">
        <label for="password">Nova senha</label>
        <input type="password" id="password" placeholder="Mínimo 6 caracteres">
      </div>
      <div class="field">
        <label for="confirm">Confirmar nova senha</label>
        <input type="password" id="confirm" placeholder="Repita a senha">
      </div>
      <div id="error" class="error" style="display:none;"></div>
      <button class="btn" id="submit-btn" onclick="handleSubmit()">Salvar nova senha</button>
    </div>

    <div id="success-view" style="display:none;">
      <h1>Senha alterada!</h1>
      <p class="success">Sua senha foi redefinida com sucesso. Você já pode voltar ao app e fazer login.</p>
    </div>

    <div id="error-view" style="display:none;">
      <h1>Link inválido</h1>
      <p class="subtitle">Este link de recuperação expirou ou é inválido. Solicite um novo link no app.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://fwmlsfcxdbgdfcxqyngq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3bWxzZmN4ZGJnZGZjeHF5bmdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0NTE0NzYsImV4cCI6MjA5ODAyNzQ3Nn0.1u1gNCMqvveCPdjmGU3oCb3O2y6AYAWtDBa3WJRYUBI';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let sessionEstablished = false;

    async function initSession() {
      const formView = document.getElementById('form-view');
      const errorView = document.getElementById('error-view');
      const btn = document.getElementById('submit-btn');

      // Disable form while establishing session
      btn.disabled = true;
      btn.textContent = 'Verificando link...';

      try {
        // PKCE flow: Supabase v2 puts a "code" in query params
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');

        if (code) {
          const { error } = await supabase.auth.exchangeCodeForSession(code);
          if (error) {
            formView.style.display = 'none';
            errorView.style.display = 'block';
            return;
          }
          sessionEstablished = true;
          btn.disabled = false;
          btn.textContent = 'Salvar nova senha';
          return;
        }

        // Legacy flow: tokens in URL hash
        const hash = window.location.hash;
        if (hash && hash.includes('access_token')) {
          // createClient auto-detects hash tokens; wait for auth state
          await new Promise((resolve) => {
            const { data: { subscription } } = supabase.auth.onAuthStateChange((event, session) => {
              if (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') {
                sessionEstablished = true;
                subscription.unsubscribe();
                resolve();
              }
            });
            // Timeout after 5s
            setTimeout(() => { subscription.unsubscribe(); resolve(); }, 5000);
          });

          if (sessionEstablished) {
            btn.disabled = false;
            btn.textContent = 'Salvar nova senha';
            return;
          }
        }

        // No code or tokens found
        formView.style.display = 'none';
        errorView.style.display = 'block';
      } catch (e) {
        formView.style.display = 'none';
        errorView.style.display = 'block';
      }
    }

    initSession();

    async function handleSubmit() {
      const password = document.getElementById('password').value;
      const confirmVal = document.getElementById('confirm').value;
      const errorEl = document.getElementById('error');
      const btn = document.getElementById('submit-btn');

      errorEl.style.display = 'none';

      if (!sessionEstablished) {
        errorEl.textContent = 'Sessão não estabelecida. Tente abrir o link do email novamente.';
        errorEl.style.display = 'block';
        return;
      }

      if (password.length < 6) {
        errorEl.textContent = 'A senha deve ter no mínimo 6 caracteres.';
        errorEl.style.display = 'block';
        return;
      }

      if (password !== confirmVal) {
        errorEl.textContent = 'As senhas não coincidem.';
        errorEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Salvando...';

      try {
        const { error } = await supabase.auth.updateUser({ password: password });

        if (error) {
          errorEl.textContent = error.message || 'Erro ao redefinir senha. Tente novamente.';
          errorEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Salvar nova senha';
          return;
        }

        document.getElementById('form-view').style.display = 'none';
        document.getElementById('success-view').style.display = 'block';
      } catch (e) {
        errorEl.textContent = 'Erro inesperado. Tente novamente.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Salvar nova senha';
      }
    }

    document.getElementById('confirm').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') handleSubmit();
    });
  </script>
</body>
</html>
